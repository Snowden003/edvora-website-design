<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Professional Leaderboard — Edvora Tech</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --muted: #6b7280;
      --accent: #1f8fff;
      --accent-soft: rgba(31, 143, 255, 0.08);
      --radius: 14px;
      --glass: rgba(255, 255, 255, 0.7);
      --border: rgba(15, 23, 42, 0.08);
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container-page {
      max-width: 1200px;
      margin: 12px auto;
      padding: 1rem;
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .page-title {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .page-title h1 {
      font-size: 1.4rem;
      margin: 0;
      color: var(--accent);
      line-height: 1.2;
    }

    .card-plain {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 8px 30px rgba(2, 6, 23, 0.06);
      padding: 18px;
      border: 1px solid rgba(15, 23, 42, 0.04);
    }

    .muted,
    .small-muted {
      color: var(--muted);
    }

    .small-muted {
      font-size: 0.85rem;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1rem;
    }

    .controls .btn,
    .controls .form-control,
    .controls .form-select {
      border-radius: 10px;
    }

    .podium-wrap {
      display: flex;
      gap: 18px;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }

    .podium {
      width: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-radius: 12px 12px 8px 8px;
      overflow: visible;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.88), var(--card));
      transition: transform 0.28s ease, box-shadow 0.28s ease;
      cursor: pointer;
    }

    .podium:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(2, 6, 23, 0.08);
    }

    .podium .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      margin-top: 12px;
      border: 4px solid #fff;
      object-fit: cover;
      box-shadow: 0 6px 20px rgba(2, 6, 23, 0.12);
    }

    .podium .meta {
      text-align: center;
      padding: 10px 12px 6px;
      width: 100%;
    }

    .podium .name {
      font-weight: 600;
      margin: 2px 0;
    }

    .podium .score {
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 700;
      margin-top: 4px;
    }

    .podium-1 {
      height: 340px;
      transform: translateY(-8px);
    }

    .podium-2 {
      height: 330px;
    }

    .podium-3 {
      height: 320px;
    }

    .podium-base {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 0 14px;
      gap: 8px;
      margin-top: auto;
    }

    .podium-base .rank,
    .rank-pill {
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .rank-1 {
      background: linear-gradient(90deg, #ffd700, #ffcf3a);
      color: #0b1220;
    }

    .rank-2 {
      background: linear-gradient(90deg, #c0c0c0, #d6d6d6);
      color: #0b1220;
    }

    .rank-3 {
      background: linear-gradient(90deg, #cd7f32, #e6a36b);
      color: #0b1220;
    }

    .table-card {
      overflow: auto;
      border-radius: 12px;
    }

    table.leaderboard-table tbody tr {
      transition: background-color 0.2s ease;
    }

    table.leaderboard-table tbody tr:hover {
      background: rgba(31, 143, 255, 0.03);
      cursor: pointer;
    }

    table.leaderboard-table tbody tr.highlight {
      background: linear-gradient(90deg, rgba(31, 143, 255, 0.10), transparent);
    }

    .chip {
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--glass);
      font-weight: 600;
      border: 1px solid rgba(15, 23, 42, 0.06);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip.badge-chip {
      background: #f8fafc;
      font-size: 0.84rem;
      padding: 5px 9px;
      border-color: rgba(15, 23, 42, 0.08);
    }

    .highlight-card {
      border: 1px solid rgba(15, 23, 42, 0.06);
      background: linear-gradient(180deg, rgba(31, 143, 255, 0.05), rgba(255, 255, 255, 1));
      border-radius: 14px;
      padding: 14px;
      height: 100%;
    }

    .highlight-value {
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 6px;
      line-height: 1.35;
    }

    .badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .user-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .user-badges .chip {
      font-size: 0.74rem;
      padding: 4px 8px;
    }

    .user-cell {
      min-width: 0;
    }

    .user-name {
      font-weight: 600;
      line-height: 1.2;
    }

    .user-meta {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .modal-content {
      border-radius: 16px;
      overflow: hidden;
    }

    .modal-header,
    .modal-footer {
      border-color: rgba(15, 23, 42, 0.08);
    }

    @media (max-width: 991.98px) {
      .podium-wrap {
        gap: 12px;
        padding-bottom: 2rem;
      }

      .podium {
        width: min(100%, 240px);
      }
    }

    @media (max-width: 575.98px) {
      .page-title h1 {
        font-size: 1.2rem;
      }

      .controls {
        justify-content: stretch;
      }

      .controls > * {
        width: 100% !important;
      }
    }
  </style>
</head>

<body>
  <main class="container-page">
    <header class="page-head">
      <div class="page-title">
        <button class="btn btn-outline-primary btn-light back-btn shadow-sm" type="button" onclick="history.back()" aria-label="Go back">
          <i class="bi bi-arrow-left"></i>
        </button>
        <div>
          <h1>Leaderboard — Top Performers</h1>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="btn-group btn-group-sm" role="group" aria-label="time range">
        <button class="btn btn-outline-primary active" type="button" data-range="today">Today</button>
        <button class="btn btn-outline-primary" type="button" data-range="week">This Week</button>
        <button class="btn btn-outline-primary" type="button" data-range="month">This Month</button>
        <button class="btn btn-outline-primary" type="button" data-range="all">All Time</button>
      </div>

      <div class="input-group input-group-sm" style="width: 220px;">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input id="searchInput" class="form-control form-control-sm" type="search" placeholder="Search name or category" aria-label="Search">
      </div>

      <select id="filterCategory" class="form-select form-select-sm" style="width: 160px;">
        <option value="">All Categories</option>
      </select>
    </div>

    <section class="card-plain mb-4">
      <div class="podium-wrap" id="podiumWrap" role="region" aria-label="Top 3 users">
        <!-- populated by JS -->
      </div>
    </section>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card-plain mb-3">
          <div class="d-flex justify-content-between align-items-start mb-2 gap-2 flex-wrap">
            <div>
              <h5 class="mb-0">Score Distribution</h5>
              <div class="small-muted">Trends for the selected range</div>
            </div>
            <div class="small-muted">Showing <span id="resultCount">0</span> users</div>
          </div>
          <canvas id="scoreChart" height="160" aria-label="Score distribution chart"></canvas>
        </div>

        <div class="card-plain">
          <div class="d-flex justify-content-between align-items-start gap-2 flex-wrap">
            <div>
              <h6 class="mb-1">Badges & Highlights</h6>
              <div class="small-muted">Dynamic badges are shown below based on user stats.</div>
            </div>
          </div>
          <div id="highlightsBox" class="row g-2 mt-1"></div>
          <div id="globalBadgesBox" class="badge-list mt-3"></div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card-plain table-card">
          <div class="d-flex justify-content-between align-items-center mb-2 gap-2 flex-wrap">
            <h6 class="mb-0">Leaderboard Table</h6>
            <div class="small-muted">
              Sort by:
              <select id="sortSelect" class="form-select form-select-sm" style="width: 180px; display: inline-block; margin-left: 8px;">
                <option value="rank">Rank</option>
                <option value="score_desc">Score (high → low)</option>
                <option value="score_asc">Score (low → high)</option>
                <option value="goals_desc">Goals (high → low)</option>
              </select>
            </div>
          </div>

          <div style="max-height: 640px; overflow: auto;">
            <table class="table leaderboard-table mb-0 align-middle">
              <thead>
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">User</th>
                  <th scope="col">Score</th>
                  <th scope="col">Goals</th>
                </tr>
              </thead>
              <tbody id="leaderTableBody">
                <!-- populated by JS -->
              </tbody>
            </table>
          </div>

          <div class="d-flex justify-content-between align-items-center mt-2 gap-2 flex-wrap">
            <div class="small-muted">
              Page size:
              <select id="perPage" class="form-select form-select-sm" style="width: 88px; display: inline-block; margin-left: 8px;">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
              </select>
            </div>
            <nav aria-label="Leaderboard pagination">
              <ul id="pagination" class="pagination pagination-sm mb-0"></ul>
            </nav>
          </div>
        </div>
      </div>
    </div>

    <footer class="mt-4 text-center small-muted">© 2026 Edvora Tech</footer>
  </main>

  <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-md modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="userModalTitle">User</h5>
          <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="userModalBody"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
          <button class="btn btn-primary" id="viewProfileBtn" type="button">View Profile</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SAMPLE_USERS = [
      { id: 1, name: "Fatima Jalili", score: 1250, goals: 32, streak: 14, avatar: "https://i.pravatar.cc/120?img=5", category: "Web" },
      { id: 2, name: "Ali Karimi", score: 1150, goals: 28, streak: 9, avatar: "https://i.pravatar.cc/120?img=12", category: "Programming" },
      { id: 3, name: "Sara Ahmadi", score: 1075, goals: 25, streak: 12, avatar: "https://i.pravatar.cc/120?img=8", category: "Data" },
      { id: 4, name: "Reza Hosseini", score: 980, goals: 20, streak: 8, avatar: "https://i.pravatar.cc/120?img=3", category: "Web" },
      { id: 5, name: "Mina Rezai", score: 940, goals: 19, streak: 7, avatar: "https://i.pravatar.cc/120?img=7", category: "Design" },
      { id: 6, name: "Neda Soleimani", score: 920, goals: 18, streak: 11, avatar: "https://i.pravatar.cc/120?img=4", category: "Programming" },
      { id: 7, name: "Omid Kazemi", score: 880, goals: 17, streak: 6, avatar: "https://i.pravatar.cc/120?img=11", category: "Data" },
      { id: 8, name: "Maryam K.", score: 830, goals: 16, streak: 10, avatar: "https://i.pravatar.cc/120?img=2", category: "Business" },
      { id: 9, name: "Ahmad Pouya", score: 790, goals: 15, streak: 4, avatar: "https://i.pravatar.cc/120?img=15", category: "Mobile" },
      { id: 10, name: "Laila Noor", score: 760, goals: 14, streak: 5, avatar: "https://i.pravatar.cc/120?img=9", category: "Data" },
      { id: 11, name: "Hassan Mehr", score: 720, goals: 13, streak: 7, avatar: "https://i.pravatar.cc/120?img=1", category: "Cloud" },
      { id: 12, name: "Zahra M.", score: 680, goals: 12, streak: 6, avatar: "https://i.pravatar.cc/120?img=6", category: "Design" },
      { id: 13, name: "Negar F.", score: 640, goals: 10, streak: 8, avatar: "https://i.pravatar.cc/120?img=10", category: "Tools" },
      { id: 14, name: "Bahram N.", score: 600, goals: 9, streak: 3, avatar: "https://i.pravatar.cc/120?img=13", category: "Cloud" },
      { id: 15, name: "Saeed R.", score: 580, goals: 8, streak: 5, avatar: "https://i.pravatar.cc/120?img=14", category: "Programming" },
      { id: 16, name: "Nina Taheri", score: 540, goals: 7, streak: 4, avatar: "https://i.pravatar.cc/120?img=16", category: "Design" },
      { id: 17, name: "Amir Z.", score: 510, goals: 6, streak: 6, avatar: "https://i.pravatar.cc/120?img=17", category: "Mobile" },
      { id: 18, name: "Laleh F.", score: 480, goals: 5, streak: 2, avatar: "https://i.pravatar.cc/120?img=18", category: "Business" },
      { id: 19, name: "Reyhaneh S.", score: 460, goals: 4, streak: 4, avatar: "https://i.pravatar.cc/120?img=19", category: "Tools" },
      { id: 20, name: "Kaveh P.", score: 430, goals: 3, streak: 3, avatar: "https://i.pravatar.cc/120?img=20", category: "Cloud" }
    ];

    const state = {
      range: 'all',
      query: '',
      category: '',
      sort: 'rank',
      perPage: 20,
      page: 1,
      currentUser: 'Fatima Rahmani'
    };

    const users = [...SAMPLE_USERS];

    const podiumWrap = document.getElementById('podiumWrap');
    const filterCategory = document.getElementById('filterCategory');
    const searchInput = document.getElementById('searchInput');
    const resultCount = document.getElementById('resultCount');
    const leaderTableBody = document.getElementById('leaderTableBody');
    const paginationEl = document.getElementById('pagination');
    const perPageSelect = document.getElementById('perPage');
    const sortSelect = document.getElementById('sortSelect');
    const scoreChartCtx = document.getElementById('scoreChart').getContext('2d');
    const highlightsBox = document.getElementById('highlightsBox');
    const globalBadgesBox = document.getElementById('globalBadgesBox');
    const userModalEl = document.getElementById('userModal');
    const userModalTitle = document.getElementById('userModalTitle');
    const userModalBody = document.getElementById('userModalBody');
    const viewProfileBtn = document.getElementById('viewProfileBtn');

    let scoreChart = null;
    let selectedUser = null;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    function sortUsers(arr) {
      const list = arr.slice();
      if (state.sort === 'rank') return list.sort((a, b) => b.score - a.score);
      if (state.sort === 'score_desc') return list.sort((a, b) => b.score - a.score);
      if (state.sort === 'score_asc') return list.sort((a, b) => a.score - b.score);
      if (state.sort === 'goals_desc') return list.sort((a, b) => b.goals - a.goals);
      return list;
    }

    function filterByRange(list) {
      if (state.range === 'today') return list.filter(u => u.score >= 900);
      if (state.range === 'week') return list.filter(u => u.score >= 700 && u.score < 900);
      if (state.range === 'month') return list.filter(u => u.score >= 500 && u.score < 700);
      return list;
    }

    function getFilteredUsers() {
      let out = users.slice();
      const q = state.query.trim().toLowerCase();

      if (q) {
        out = out.filter((u) => (u.name + ' ' + (u.category || '')).toLowerCase().includes(q));
      }

      if (state.category) {
        out = out.filter((u) => u.category === state.category);
      }

      out = filterByRange(out);
      out = sortUsers(out);

      return out;
    }

    function paginate(arr) {
      const per = Math.max(1, parseInt(state.perPage, 10) || 20);
      const page = Math.max(1, parseInt(state.page, 10) || 1);
      const start = (page - 1) * per;
      const end = start + per;
      return {
        items: arr.slice(start, end),
        total: arr.length,
        totalPages: Math.max(1, Math.ceil(arr.length / per))
      };
    }

    function getBadges(user) {
      const badges = [];

      if (user.streak >= 10) badges.push('🔥 Streak Master');
      if (user.goals >= 25) badges.push('🎯 Goal Hunter');
      if (user.score >= 1000) badges.push('🚀 Fast Achiever');
      if (user.goals >= 15 && user.streak >= 5) badges.push('🤝 Team Player');

      return badges;
    }

    function getHighlights(list) {
      if (!list.length) return [];

      const sortedByScore = list.slice().sort((a, b) => b.score - a.score);
      const sortedByGoals = list.slice().sort((a, b) => b.goals - a.goals);
      const sortedByStreak = list.slice().sort((a, b) => b.streak - a.streak);
      const averageScore = Math.round(list.reduce((sum, u) => sum + u.score, 0) / list.length);

      return [
        { label: 'Top Score', value: `${sortedByScore[0].name} — ${sortedByScore[0].score.toLocaleString()} pts`, icon: 'bi-trophy' },
        { label: 'Most Goals', value: `${sortedByGoals[0].name} — ${sortedByGoals[0].goals} goals`, icon: 'bi-bullseye' },
        { label: 'Longest Streak', value: `${sortedByStreak[0].name} — ${sortedByStreak[0].streak} days`, icon: 'bi-lightning-charge' },
        { label: 'Average Score', value: `${averageScore.toLocaleString()} pts`, icon: 'bi-graph-up-arrow' }
      ];
    }

    function renderHighlights(list) {
      const highlights = getHighlights(list);
      highlightsBox.innerHTML = highlights.map((item) => `
        <div class="col-md-6">
          <div class="highlight-card">
            <div class="d-flex align-items-center gap-2 text-primary">
              <i class="bi ${item.icon}"></i>
              <strong>${escapeHtml(item.label)}</strong>
            </div>
            <div class="highlight-value">${escapeHtml(item.value)}</div>
          </div>
        </div>
      `).join('');
    }

    function renderGlobalBadges(list) {
      const badges = new Set();
      list.forEach((user) => getBadges(user).forEach((badge) => badges.add(badge)));
      globalBadgesBox.innerHTML = Array.from(badges).map((badge) => `<span class="chip badge-chip">${escapeHtml(badge)}</span>`).join('');
    }

    function renderPodium(top3) {
      podiumWrap.innerHTML = '';
      const order = [top3[0], top3[1], top3[2]];
      const classes = ['podium-1', 'podium-2', 'podium-3'];
      const rankMap = [1, 2, 3];

      for (let i = 0; i < 3; i++) {
        const user = order[i];
        const rank = rankMap[i];

        if (!user) {
          const empty = document.createElement('div');
          empty.className = `podium ${classes[i]}`;
          empty.innerHTML = `
            <div class="meta">
              <div class="name muted">—</div>
              <div class="small-muted">No user</div>
            </div>
            <div class="podium-base"><div class="rank rank-${rank}">#${rank}</div></div>
          `;
          podiumWrap.appendChild(empty);
          continue;
        }

        const badges = getBadges(user).slice(0, 2).map((badge) => `<span class="chip badge-chip">${escapeHtml(badge)}</span>`).join('');

        const el = document.createElement('div');
        el.className = `podium ${classes[i]}`;
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        el.innerHTML = `
          <img class="avatar" src="${user.avatar}" alt="${escapeHtml(user.name)}">
          <div class="meta">
            <div class="name">${escapeHtml(user.name)}</div>
            <div class="small-muted">${escapeHtml(user.category)} • ${user.goals} goals</div>
            <div class="score">${user.score.toLocaleString()} pts</div>
            <div class="user-badges justify-content-center">${badges}</div>
          </div>
          <div class="podium-base">
            <div class="rank rank-${rank}">#${rank}</div>
          </div>
        `;
        el.addEventListener('click', () => openUserModal(user));
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openUserModal(user);
          }
        });
        podiumWrap.appendChild(el);
      }
    }

    function renderTable(paginated) {
      leaderTableBody.innerHTML = '';

      paginated.items.forEach((user, idx) => {
        const rank = ((state.page - 1) * state.perPage) + idx + 1;
        const tr = document.createElement('tr');
        tr.setAttribute('tabindex', '0');
        tr.setAttribute('role', 'button');

        if (user.name === state.currentUser) {
          tr.classList.add('highlight');
        }

        const badges = getBadges(user).slice(0, 2).map((badge) => `<span class="chip badge-chip">${escapeHtml(badge)}</span>`).join('');

        tr.innerHTML = `
          <td class="align-middle">${rank}</td>
          <td class="align-middle user-cell">
            <div class="d-flex align-items-center gap-2">
              <img src="${user.avatar}" alt="${escapeHtml(user.name)}" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 12px rgba(2, 6, 23, 0.08);">
              <div class="min-w-0">
                <div class="user-name text-truncate">${escapeHtml(user.name)}</div>
                <div class="user-meta text-truncate">${escapeHtml(user.category)} • ${user.streak} day streak</div>
                <div class="user-badges">${badges}</div>
              </div>
            </div>
          </td>
          <td class="align-middle">${user.score.toLocaleString()}</td>
          <td class="align-middle">${user.goals}</td>
        `;

        tr.addEventListener('click', () => openUserModal(user));
        tr.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            openUserModal(user);
          }
        });

        leaderTableBody.appendChild(tr);
      });
    }

    function renderPagination(totalPages) {
      paginationEl.innerHTML = '';
      const current = state.page;
      if (totalPages <= 1) return;

      const addItem = (label, page, disabled = false, active = false, ariaLabel = '') => {
        const li = document.createElement('li');
        li.className = `page-item ${disabled ? 'disabled' : ''} ${active ? 'active' : ''}`;
        li.innerHTML = `<a class="page-link" href="#" data-page="${page}" ${ariaLabel ? `aria-label="${ariaLabel}"` : ''}>${label}</a>`;
        paginationEl.appendChild(li);
      };

      addItem('&laquo;', current - 1, current === 1, false, 'Previous');

      const maxShow = 5;
      let start = Math.max(1, current - Math.floor(maxShow / 2));
      let end = Math.min(totalPages, start + maxShow - 1);
      if (end - start < maxShow - 1) start = Math.max(1, end - maxShow + 1);

      for (let p = start; p <= end; p++) {
        addItem(String(p), p, false, p === current);
      }

      addItem('&raquo;', current + 1, current === totalPages, false, 'Next');
    }

    function updateChart(filtered) {
      const labels = filtered.slice(0, 10).map((u) => u.name.split(' ')[0]);
      const data = filtered.slice(0, 10).map((u) => u.score);

      if (scoreChart) {
        scoreChart.data.labels = labels;
        scoreChart.data.datasets[0].data = data;
        scoreChart.update();
        return;
      }

      scoreChart = new Chart(scoreChartCtx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'Score',
            data,
            backgroundColor: labels.map((_, i) => `rgba(31, 143, 255, ${0.15 + (i * 0.05)})`),
            borderRadius: 8,
            barThickness: 18
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { mode: 'index', intersect: false }
          },
          scales: {
            x: { grid: { display: false } },
            y: { grid: { color: 'rgba(0,0,0,0.04)' } }
          }
        }
      });
    }

    function populateCategories() {
      const cats = Array.from(new Set(users.map((u) => u.category))).sort();
      cats.forEach((category) => {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        filterCategory.appendChild(option);
      });
    }

    function renderAll() {
      const filtered = getFilteredUsers();
      const paginated = paginate(filtered);

      resultCount.textContent = filtered.length;
      renderPodium(filtered.slice(0, 3));
      renderTable(paginated);
      renderPagination(paginated.totalPages);
      updateChart(filtered);
      renderHighlights(filtered);
      renderGlobalBadges(filtered);
    }

    function openUserModal(user) {
      selectedUser = user;
      const badges = getBadges(user);

      userModalTitle.textContent = user.name;
      userModalBody.innerHTML = `
        <div class="d-flex gap-3 align-items-center">
          <img src="${user.avatar}" alt="${escapeHtml(user.name)}" style="width: 88px; height: 88px; border-radius: 50%; object-fit: cover; box-shadow: 0 6px 20px rgba(2, 6, 23, 0.12);">
          <div>
            <div style="font-weight: 700; font-size: 1.05rem;">${escapeHtml(user.name)}</div>
            <div class="small-muted">${escapeHtml(user.category)}</div>
            <div style="margin-top: 8px;"><strong>${user.score.toLocaleString()} pts</strong> • ${user.goals} goals • ${user.streak} day streak</div>
          </div>
        </div>
        <hr>
        <div class="d-flex flex-wrap gap-2">
          ${badges.length ? badges.map((badge) => `<span class="chip badge-chip">${escapeHtml(badge)}</span>`).join('') : '<span class="small-muted">No badges yet.</span>'}
        </div>
        <p class="small-muted mt-3 mb-0">Recent achievements and activity feed would appear here when connected to your API.</p>
      `;

      const modal = bootstrap.Modal.getOrCreateInstance(userModalEl);
      modal.show();
    }

    function syncCurrentUserButton() {
      if (!selectedUser) {
        viewProfileBtn.disabled = true;
        return;
      }
      viewProfileBtn.disabled = false;
    }

    document.querySelectorAll('[data-range]').forEach((button) => {
      button.addEventListener('click', (e) => {
        document.querySelectorAll('[data-range]').forEach((b) => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        state.range = e.currentTarget.getAttribute('data-range');
        state.page = 1;
        renderAll();
      });
    });

    searchInput.addEventListener('input', (e) => {
      state.query = e.target.value;
      state.page = 1;
      renderAll();
    });

    filterCategory.addEventListener('change', (e) => {
      state.category = e.target.value;
      state.page = 1;
      renderAll();
    });

    sortSelect.addEventListener('change', (e) => {
      state.sort = e.target.value;
      state.page = 1;
      renderAll();
    });

    perPageSelect.addEventListener('change', (e) => {
      state.perPage = parseInt(e.target.value, 10) || 20;
      state.page = 1;
      renderAll();
    });

    paginationEl.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (!link) return;
      e.preventDefault();

      const page = Number(link.dataset.page);
      if (!page || page < 1) return;

      state.page = page;
      renderAll();
      window.scrollTo({ top: 160, behavior: 'smooth' });
    });

    viewProfileBtn.addEventListener('click', () => {
      if (!selectedUser) return;
      alert(`Open profile for ${selectedUser.name}`);
    });

    userModalEl.addEventListener('shown.bs.modal', syncCurrentUserButton);

    function init() {
      populateCategories();
      renderAll();
      syncCurrentUserButton();
    }

    init();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

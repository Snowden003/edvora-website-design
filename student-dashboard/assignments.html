<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignments</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f7fb;
      }
      .card {
        border: none;
        border-radius: 16px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }
      .filter-btn.active {
        background: #0d6efd;
        color: #fff;
      }
      .back-btn {
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="container py-4">
      <!-- Header -->
      <div class="d-flex align-items-center mb-4 gap-3">
        <button
          class="btn btn-outline-primary btn-light back-btn shadow-sm"
          onclick="history.back()"
          aria-label="Go back"
        >
          <i class="bi bi-arrow-left"></i>
        </button>
        <h4 class="fw-bold mb-0">Assignments</h4>
      </div>

      <!-- Search + Sort -->
      <div class="d-flex justify-content-between mb-3 flex-wrap gap-2">
        <input
          id="searchInput"
          class="form-control w-auto"
          placeholder="Search..."
        />

        <select id="sortSelect" class="form-select w-auto">
          <option value="deadline">Sort by Deadline</option>
          <option value="course">Sort by Course</option>
        </select>
      </div>

      <!-- Filters -->
      <div class="btn-group mb-3">
        <button
          class="btn btn-outline-primary filter-btn active"
          data-filter="all"
        >
          All
        </button>
        <button
          class="btn btn-outline-primary filter-btn"
          data-filter="pending"
        >
          Pending
        </button>
        <button
          class="btn btn-outline-primary filter-btn"
          data-filter="submitted"
        >
          Submitted
        </button>
        <button class="btn btn-outline-primary filter-btn" data-filter="late">
          Late
        </button>
      </div>

      <!-- Table -->
      <div class="card p-3">
        <div class="table-responsive">
          <table class="table" id="assignmentsTable">
            <thead>
              <tr>
                <th>Title</th>
                <th>Course</th>
                <th>Deadline</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="assignmentModal">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="modalTitle"></h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p id="modalDesc"></p>
            <p><strong>Deadline:</strong> <span id="modalDeadline"></span></p>
            <p><strong>Grade:</strong> <span id="modalGrade"></span></p>

            <hr />

            <input type="file" id="fileInput" class="form-control mb-2" />
            <textarea
              id="textInput"
              class="form-control mb-2"
              placeholder="Optional message"
            ></textarea>
            <button class="btn btn-success" id="submitBtn">Submit</button>

            <div id="preview" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const assignments = [
        {
          title: "UI Design",
          course: "Web",
          deadline: "2026-04-05",
          status: "pending",
          desc: "Design dashboard UI",
          grade: "-",
        },
        {
          title: "React App",
          course: "Frontend",
          deadline: "2026-04-01",
          status: "submitted",
          desc: "Build React app",
          grade: "-",
        },
        {
          title: "Database",
          course: "DB",
          deadline: "2026-03-20",
          status: "late",
          desc: "Schema design",
          grade: "-",
        },
        {
          title: "API",
          course: "Backend",
          deadline: "2026-03-15",
          status: "graded",
          desc: "API integration",
          grade: "90%",
        },
      ];

      let currentData = [...assignments];
      let currentIndex = null;

      const tbody = document.querySelector("#assignmentsTable tbody");
      const modalEl = document.getElementById("assignmentModal");
      const modal = new bootstrap.Modal(modalEl);

      function render(data) {
        tbody.innerHTML = "";
        data.forEach((a, i) => {
          const row = document.createElement("tr");
          row.innerHTML = `
      <td>${a.title}</td>
      <td>${a.course}</td>
      <td>${a.deadline}</td>
      <td><span class="badge bg-${getColor(a.status)}">${a.status}</span></td>
      <td><button class="btn btn-sm btn-primary">View</button></td>
    `;

          row
            .querySelector("button")
            .addEventListener("click", () => openModal(i));
          tbody.appendChild(row);
        });
      }

      function getColor(s) {
        if (s === "pending") return "warning";
        if (s === "submitted") return "primary";
        if (s === "graded") return "success";
        return "danger";
      }

      function openModal(i) {
        currentIndex = i;
        const a = currentData[i];

        document.getElementById("modalTitle").textContent = a.title;
        document.getElementById("modalDesc").textContent = a.desc;
        document.getElementById("modalDeadline").textContent = a.deadline;
        document.getElementById("modalGrade").textContent = a.grade;

        document.getElementById("preview").innerHTML = "";
        document.getElementById("fileInput").value = "";

        modal.show();
      }

      // submit

      document.getElementById("submitBtn").addEventListener("click", () => {
        const file = document.getElementById("fileInput").files[0];
        const preview = document.getElementById("preview");

        if (file) {
          preview.innerHTML = `<div class='alert alert-success'>Uploaded: ${file.name}</div>`;
          currentData[currentIndex].status = "submitted";
          render(currentData);
        } else {
          preview.innerHTML = `<div class='alert alert-danger'>Please select a file</div>`;
        }
      });

      // filters

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");

          const f = btn.dataset.filter;
          currentData =
            f === "all"
              ? [...assignments]
              : assignments.filter((a) => a.status === f);
          render(currentData);
        });
      });

      // sort

      document.getElementById("sortSelect").addEventListener("change", (e) => {
        const v = e.target.value;

        // always sort from ORIGINAL data (not already sorted/filtered one)
        let baseData = [...currentData];

        if (v === "deadline") {
          baseData.sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
        } else if (v === "course") {
          baseData.sort((a, b) => a.course.localeCompare(b.course));
        }

        currentData = baseData;
        render(currentData);
      });

      // search

      document.getElementById("searchInput").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase();
        currentData = assignments.filter((a) =>
          a.title.toLowerCase().includes(q),
        );
        render(currentData);
      });

      function goBack() {
        history.back();
      }

      render(currentData);
    </script>
  </body>
</html>

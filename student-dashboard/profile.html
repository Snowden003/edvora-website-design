<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile — Edvora Tech</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body { background:#f5f7fb; font-family:Poppins,system-ui; }
    .page{max-width:1000px;margin:auto}
    .card{border:none;border-radius:20px;box-shadow:0 15px 35px rgba(0,0,0,0.08)}

    .profile-header{
      background:linear-gradient(135deg,#0f172a,#2563eb);
      color:white;border-radius:20px;padding:30px
    }

    .avatar{width:120px;height:120px;object-fit:cover;border-radius:50%;border:4px solid white}

    .stat-box{
      background:white;border-radius:16px;padding:15px;text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,0.05);height:100%
    }
    .fw-bold{color: #2563eb;}

    .form-control{border-radius:12px;padding:10px}
    .btn{border-radius:12px}
  </style>
</head>

<body>
<main class="page py-4 px-3">

<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-4">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-outline-primary btn-light back-btn shadow-sm" type="button" onclick="history.back()" aria-label="Go back">
          <i class="bi bi-arrow-left"></i>
        </button>
    <div>
      <h4 class="fw-bold mb-0">Profile</h4>
    </div>
  </div>
  <button class="btn btn-primary" onclick="document.getElementById('profileForm').requestSubmit()">Save Changes</button>
</div>

<!-- Hero -->
<div class="profile-header mb-4">
  <div class="row align-items-center text-center text-md-start">

    <div class="col-md-3 mb-3 mb-md-0">
      <img id="avatarPreview" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200" class="avatar mb-2" />
      <div>
        <input type="file" id="avatarInput" hidden />
        <button class="btn btn-light btn-sm" onclick="avatarInput.click()">Change Photo</button>
      </div>
    </div>

    <div class="col-md-9">
      <h3>John Doe</h3>
      <p class="mb-2">Frontend Developer • Student</p>

      <div class="row g-3">
        <div class="col-4">
          <div class="stat-box">
            <div class="fw-bold">12</div>
            <small class="text-muted">Courses</small>
          </div>
        </div>
        <div class="col-4">
          <div class="stat-box">
            <div class="fw-bold">5</div>
            <small class="text-muted">Certificates</small>
          </div>
        </div>
        <div class="col-4">
          <div class="stat-box">
            <div class="fw-bold">320</div>
            <small class="text-muted">XP</small>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Form -->
<form id="profileForm" class="card p-4" novalidate>
  <div class="row g-3">

    <div class="col-md-6">
      <label class="form-label">Full Name</label>
      <input id="name" class="form-control" required />
      <div class="invalid-feedback">Name is required</div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input id="email" type="email" class="form-control" required />
      <div class="invalid-feedback">Enter a valid email</div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Phone</label>
      <input id="phone" class="form-control" pattern="^[0-9+\- ]{7,15}$" />
      <div class="invalid-feedback">Invalid phone number</div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Username</label>
      <input id="username" class="form-control" required />
      <div class="invalid-feedback">Username required</div>
    </div>

    <div class="col-12">
      <label class="form-label">Bio</label>
      <textarea id="bio" class="form-control" rows="3"></textarea>
    </div>

    <div class="col-12">
      <label class="form-label">Password</label>
      <input id="password" type="password" class="form-control" minlength="6" />
      <div class="invalid-feedback">Min 6 characters</div>
    </div>

  </div>
</form>

<footer class="text-center mt-4 text-muted small">© 2026 Edvora Tech</footer>

</main>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
  <div id="saveToast" class="toast align-items-center text-bg-success border-0">
    <div class="d-flex">
      <div class="toast-body">Profile saved successfully ✅</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script>
const form = document.getElementById('profileForm');

form.addEventListener('submit', function(e){
  e.preventDefault();

  if(!form.checkValidity()){
    e.stopPropagation();
    form.classList.add('was-validated');
    return;
  }

  form.classList.remove('was-validated');

  const toast = new bootstrap.Toast(document.getElementById('saveToast'));
  toast.show();
});

// Avatar preview
avatarInput.addEventListener('change', e=>{
  const file = e.target.files[0];
  if(file) avatarPreview.src = URL.createObjectURL(file);
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
